<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Actividad práctica DSIT · Universidad de los Andes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
<style>
/* ===== Tokens ID Uniandes ===== */
:root{
  --brand-black:#191916; --brand-white:#ffffff;
  --n20:#fcfcfa; --n30:#f5f5f2; --n40:#e0dfda; --n50:#bab9b3; --n60:#8a8984; --n70:#73726d; --n80:#616160; --n90:#4d4d4c;
  --yellow:#ffe41e; --yellow2:#fff18b;
  --bg:#f7f6f0; --surface:#fcfcfa; --surface-2:#f5f5f2;
  --text:#1f1f1c; --text-2:#535351; --text-dis:#bab9b3; --link:#2442b2;
  --success:#095d0d; --alert:#e58617; --error:#a9142f;
  --border:#191916; --line:#e0dfda; --focus-ring:#191916;
  --btn-bg:#191916; --btn-ink:#fcfcfa; --btn-hover-bg:#ffe41e; --btn-hover-ink:#1f1f1c; --btn-focus-bg:#fff18b;
  --btn2-hover:#bab9b3; --btn3-hover:#f5f5f2; --sel-bg:#f5f5f2;
  --chip-sel-bg:#4d4d4c; --chip-sel-ink:#fcfcfa; --chip-fill:#f5f5f2;
  --font-sans:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sp-04:4px; --sp-08:8px; --sp-12:12px; --sp-16:16px; --sp-20:20px; --sp-24:24px; --sp-32:32px; --sp-40:40px; --sp-48:48px; --sp-64:64px; --sp-80:80px;
  --margin:20px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (min-width:768px){ :root{ --margin:48px; } }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#333331; --surface:#4d4c4c; --surface-2:#3e3e3c;
    --text:#fcfcfa; --text-2:#a4a4a4; --text-dis:#838277; --link:#7ca0db;
    --success:#79db7d; --alert:#f5ad58; --error:#f598a9;
    --border:#fcfcfa; --line:#616160; --focus-ring:#fcfcfa;
    --btn-bg:#fcfcfa; --btn-ink:#1f1f1c; --btn-hover-bg:#f2e055; --btn-hover-ink:#1f1f1c;
    --btn2-hover:#4d4d4c; --btn3-hover:#4d4d4c; --sel-bg:#3e3e3c; --chip-sel-bg:#fcfcfa; --chip-sel-ink:#1f1f1c; --chip-fill:#4d4d4c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#333331; --surface:#4d4c4c; --surface-2:#3e3e3c;
  --text:#fcfcfa; --text-2:#a4a4a4; --text-dis:#838277; --link:#7ca0db;
  --success:#79db7d; --alert:#f5ad58; --error:#f598a9;
  --border:#fcfcfa; --line:#616160; --focus-ring:#fcfcfa;
  --btn-bg:#fcfcfa; --btn-ink:#1f1f1c; --btn-hover-bg:#f2e055; --btn-hover-ink:#1f1f1c;
  --btn2-hover:#4d4d4c; --btn3-hover:#4d4d4c; --sel-bg:#3e3e3c; --chip-sel-bg:#fcfcfa; --chip-sel-ink:#1f1f1c; --chip-fill:#4d4d4c;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 140px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;vertical-align:-4px;flex:0 0 auto}

/* ===== Navbar (ID Uniandes) ===== */
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand-black);z-index:30}
.wrap{max-width:1216px;margin:0 auto;padding:0 var(--margin)}
.nb{background:var(--brand-black);color:var(--n20)}
.nb-bar{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-08) var(--sp-16);max-width:1504px;margin:0 auto;min-height:48px;padding:6px var(--margin)}
@media (min-width:768px){.nb-bar{min-height:56px;gap:var(--sp-24);flex-wrap:nowrap}}
@media (min-width:1280px){.nb-bar{padding:0 var(--sp-64)}}
.nb-brand{display:flex;align-items:center;gap:var(--sp-12);background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left;min-width:0;border-radius:0}
@media (min-width:768px){.nb-brand{gap:var(--sp-16)}}
.logo{display:block;height:28px;width:auto;flex:0 0 auto}
@media (min-width:768px){.logo{height:34px}}
.nb-divider{width:1px;height:24px;background:currentColor;flex:0 0 auto}
@media (min-width:768px){.nb-divider{height:32px}}
.nb-unit{max-width:20ch;font-size:14px;line-height:16px;letter-spacing:-.01em;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nb-nav{flex:1;display:none;justify-content:center;min-width:0}
@media (min-width:1280px){.nb-nav{display:flex}}
.nb-list{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--sp-04) var(--sp-20);list-style:none;margin:0;padding:0}
.nb-link{background:none;border:0;border-bottom:1px solid transparent;color:inherit;cursor:pointer;padding:var(--sp-04) 0;font-size:18px;line-height:24px;font-weight:400;letter-spacing:.01em;border-radius:0}
.nb-link:hover{border-bottom-color:currentColor}
.nb-link.is-active{border-bottom:2px solid var(--yellow)}
.nb-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-08);min-width:40px;height:40px;padding:0 var(--sp-08);background:transparent;border:0;color:inherit;font-size:16px;line-height:20px;font-weight:600;letter-spacing:.02em;cursor:pointer;border-radius:0}
.nb-btn:hover,.nb-btn[aria-pressed="true"],.nb-btn[aria-expanded="true"]{background:var(--n90)}
.nb button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.nb-timer{margin-left:auto}
.nb-menu{order:2;margin-left:auto}
.nb-menu .mtxt{display:none}
@media (min-width:768px){.nb-menu{order:0;margin-left:0}.nb-menu .mtxt{display:inline}}
@media (min-width:1280px){.nb-menu{display:none}}
@media (max-width:767px){
  .nb-timer{order:3;width:100%;margin-left:0;border-top:1px solid var(--n80);padding-top:4px}
  .nb-timer:empty{display:none}
  .nb-timer .timer{width:100%}
  .nb-timer .t-clock{margin-right:auto;text-align:left}
}
.timer{display:flex;align-items:center;gap:var(--sp-08)}
.t-lab{font-size:.875rem;color:#a4a4a4}
.t-clock{font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:600;min-width:3.4ch;text-align:right;letter-spacing:.02em}
.timer.warn .t-clock{color:var(--yellow)}
.tbar{height:4px;background:#2e2e2b}
.tbar b{display:block;height:100%;width:0;background:var(--yellow);transition:width 1s linear}
@media (prefers-reduced-motion: reduce){.tbar b{transition:none}}
.nb-panel{border-top:1px solid var(--n80);padding:var(--sp-08) var(--margin) var(--sp-24)}
@media (min-width:1280px){.nb-panel{display:none!important}}
.nb-panel ul{list-style:none;margin:0 auto;padding:0;max-width:1216px}
.nb-panel-link{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--n80);color:inherit;cursor:pointer;padding:var(--sp-12) 0;font-size:18px;line-height:24px;font-weight:400;border-radius:0}
.nb-panel-link.is-active{font-weight:600;text-decoration:underline;text-underline-offset:4px}
.sync{font-size:.875rem;color:#a4a4a4}
/* Stepper de progreso general */
.gstep{background:var(--surface);border-bottom:1px solid var(--line);color:var(--text)}
.gs-list{list-style:none;margin:0 auto;padding:var(--sp-12) 0;display:grid;grid-template-columns:repeat(6,1fr);max-width:1000px}
.gs-step{position:relative}
.gs-step + .gs-step::before{content:"";position:absolute;top:17px;left:calc(-50% + 22px);right:calc(50% + 22px);height:2px;background:var(--n40)}
.gs-step.after-active::before{background:var(--border)}
.gs-step.after-success::before{background:var(--success)}
.gs-btn{width:100%;background:none;border:0;padding:0 var(--sp-04);display:flex;flex-direction:column;align-items:center;gap:var(--sp-08);cursor:pointer;color:var(--text);border-radius:0}
.gs-sym{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--n40);background:var(--surface);color:var(--text-2);display:grid;place-items:center;font-weight:700;font-size:16px;line-height:1}
.gs-sym .ms{font-size:20px;vertical-align:0}
.gs-btn:hover:not([disabled]) .gs-sym{border-color:var(--border)}
.gs-btn[disabled]{cursor:default}
.gs-step.active .gs-sym{border-color:var(--border);color:var(--text)}
.gs-step.success .gs-sym{background:var(--success);border-color:var(--success);color:var(--surface)}
.gs-lab{font-size:16px;line-height:24px;color:var(--text-2);white-space:nowrap;max-width:16ch;overflow:hidden;text-overflow:ellipsis}
.gs-step.active .gs-lab,.gs-step.success .gs-lab{color:var(--text);font-weight:700}
.gs-cur{display:none}
@media (max-width:767px){
  .gs-lab{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .gs-list{padding:var(--sp-08) 0 var(--sp-04)}
  .gs-cur{display:block;margin:0 0 var(--sp-08);text-align:center;font-size:.875rem;line-height:1.25rem;font-weight:600}
}
/* Tabs de equipos (Evaluación) */
.ttabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);margin-bottom:var(--sp-32)}
.ttab{border:0;background:transparent;padding:var(--sp-12) var(--sp-12);cursor:pointer;text-align:left;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:var(--sp-08);align-items:flex-start;color:var(--text-2);border-radius:0}
.ttab:hover{background:var(--brand-black);color:var(--n20)}
.ttab[aria-selected="true"]{border-bottom-color:var(--text);color:var(--text)}
.ttab[aria-selected="true"]:hover{color:var(--n20)}
.ttab .tt{display:block;font-size:1rem;line-height:1.25rem}
.ttab[aria-selected="true"] .tt{font-weight:700}
.ttab .ts{display:block;font-size:.8125rem;line-height:1.125rem;margin-top:2px}
@media (max-width:560px){.ttab .ms{display:none}.ttab{padding:var(--sp-12) var(--sp-08)}.ttab .tt{font-size:.875rem}}

/* ===== Tipografía ===== */
main{max-width:1216px;margin:0 auto;padding:var(--sp-40) var(--margin) var(--sp-80)}
h1{font-size:2rem;line-height:2.5rem;font-weight:700;letter-spacing:-.02em;margin:0 0 var(--sp-16)}
@media (min-width:768px){h1{font-size:2.5rem;line-height:3rem}}
@media (min-width:1280px){h1{font-size:3rem;line-height:3.5rem}}
h2{font-size:1.5rem;line-height:1.75rem;font-weight:500;margin:0 0 var(--sp-12)}
h3{font-size:1.25rem;line-height:1.75rem;font-weight:600;margin:0 0 var(--sp-08)}
.lead{font-size:1rem;line-height:1.5rem;color:var(--text);max-width:72ch;margin:0 0 var(--sp-32)}
@media (min-width:768px){.lead{font-size:1.125rem;line-height:1.75rem}}
@media (min-width:1280px){.lead{font-size:1.25rem;line-height:2rem}}
.meta{color:var(--text-2);font-size:.875rem;line-height:1.25rem}
.divider{width:130px;height:4px;background:var(--yellow);border:0;margin:0 0 var(--sp-24)}
.section{margin-top:var(--sp-48)}
.eyebrow{font-size:.875rem;line-height:1.25rem;color:var(--text-2);margin:0 0 var(--sp-08)}

/* ===== Botones (rectos) ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-08);min-height:52px;padding:0 var(--sp-24);border:1px solid var(--border);background:transparent;color:var(--text);font-size:1.125rem;line-height:1.25rem;font-weight:600;letter-spacing:.04em;cursor:pointer;border-radius:0;text-decoration:none}
.btn:hover{background:var(--btn2-hover)}
.btn.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-ink)}
.btn.primary:hover{background:var(--btn-hover-bg);border-color:var(--btn-hover-bg);color:var(--btn-hover-ink)}
.btn.primary:focus-visible{background:var(--btn-focus-bg);border-color:var(--btn-focus-bg);color:#1f1f1c}
.btn.tertiary{border-color:transparent}
.btn.tertiary:hover{background:var(--btn3-hover);border-color:var(--border)}
.btn.small{min-height:40px;padding:0 var(--sp-16);font-size:1rem;line-height:1rem}
.btn[disabled]{background:var(--n40);border-color:var(--n40);color:var(--n90);cursor:default}
.actions{display:flex;gap:var(--sp-12);flex-wrap:wrap;align-items:center;margin-top:var(--sp-40)}

/* ===== Chip ===== */
.chip{display:inline-flex;align-items:center;gap:var(--sp-04);height:28px;padding:0 var(--sp-12);font-size:11px;line-height:1;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:999px}
.chip.medium{height:36px;padding:0 var(--sp-16);font-size:12px}
.chip.fill{background:var(--chip-fill)}
.chip.is-selected{background:var(--chip-sel-bg);color:var(--chip-sel-ink);border-color:var(--chip-sel-bg);font-weight:600}
.chip .ms{font-size:16px;vertical-align:0}
.acc{margin-top:var(--sp-24);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.acc-h{margin:0;font-size:1rem;line-height:1.5rem}
.acc-btn{width:100%;min-height:48px;display:flex;justify-content:space-between;align-items:center;gap:var(--sp-12);background:transparent;border:0;padding:var(--sp-08) var(--sp-12);color:var(--text);font-weight:700;font-size:1rem;cursor:pointer;text-align:left;border-radius:0}
.acc-btn:hover{background:var(--btn3-hover)}
.acc-btn:focus-visible{outline:none;box-shadow:inset 0 0 0 1px var(--focus-ring)}
.acc-panel{padding:var(--sp-08) var(--sp-12) var(--sp-20)}
.levels{margin:0;display:grid;gap:var(--sp-16)}
.levels dt{font-weight:700}
.levels dd{margin:var(--sp-04) 0 0;color:var(--text-2);max-width:72ch}
.mesa-top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-12)}

/* ===== Bienvenida ===== */
.mesas{display:grid;gap:var(--sp-16);grid-template-columns:1fr;margin-top:var(--sp-24)}
@media (min-width:768px){.mesas{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1280px){.mesas{grid-template-columns:repeat(3,1fr);gap:var(--sp-32)}}
.mesa{text-align:left;background:var(--surface);border:1px solid var(--line);padding:var(--sp-24);cursor:pointer;display:flex;flex-direction:column;gap:var(--sp-12);min-height:180px;border-radius:0;color:var(--text)}
.mesa:hover{border-color:var(--border)}
.mesa .num{font-family:var(--font-serif);font-size:3rem;line-height:3.5rem;font-weight:500;letter-spacing:-.02em}
.mesa strong{font-size:1.25rem;line-height:1.5rem;font-weight:500}
@media (min-width:1280px){.mesa strong{font-size:1.5rem;line-height:1.75rem}}
.mesa .go{margin-top:auto;display:flex;align-items:center;gap:6px;font-weight:600;letter-spacing:.04em;font-size:1rem}
.mesa.current{border:2px solid var(--border);padding:calc(var(--sp-24) - 1px)}

/* ===== Caso ===== */
.quote{margin:0;border-left:1px solid var(--n50);padding:var(--sp-04) 0 var(--sp-04) var(--sp-24);font-family:var(--font-serif);font-size:1.25rem;line-height:1.75rem;max-width:68ch}
@media (min-width:1280px){.quote{font-size:1.5rem;line-height:2rem;font-weight:400}}

/* ===== Preguntas clave ===== */
.box{background:var(--surface);border:1px solid var(--line);padding:var(--sp-24)}
@media (min-width:768px){.box{padding:var(--sp-32)}}
.facts{display:flex;flex-wrap:wrap;gap:var(--sp-08) var(--sp-32);margin:0 0 var(--sp-24)}
.facts div{font-size:.875rem;line-height:1.25rem}
.facts dt{color:var(--text-2)}
.facts dd{margin:0;font-weight:600}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--sp-16);max-width:80ch}
.notes li{border-left:1px solid var(--n50);padding-left:var(--sp-24);font-size:1rem;line-height:1.5rem}
@media (min-width:1280px){.notes li{font-size:1.125rem;line-height:1.75rem}}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-16);flex-wrap:wrap}
.progress{display:flex;align-items:center;gap:var(--sp-08);font-size:.875rem;color:var(--text-2)}
.progress .bar{width:120px;height:4px;background:var(--line)}
.progress .bar b{display:block;height:100%;background:var(--text)}
.qs{display:flex;flex-direction:column;gap:var(--sp-16);margin-top:var(--sp-16)}
.qsec{border:1px solid var(--line);background:var(--surface-2)}
.qsec .qhead{padding:var(--sp-20) var(--sp-24) var(--sp-16);border-bottom:1px solid var(--line);background:var(--surface)}
.qsec .qhead h2{margin:0}
.qscroll{margin:0;padding:var(--sp-16) var(--sp-24) var(--sp-24);max-height:clamp(360px, calc(100vh - 360px), 720px);overflow-y:auto;overscroll-behavior:auto;scroll-padding-top:var(--sp-16)}
.qscroll:focus-visible{outline:2px solid var(--focus-ring);outline-offset:-2px}
@media (max-width:767px){.qsec .qhead,.qscroll{padding-left:var(--sp-16);padding-right:var(--sp-16)}.qscroll{max-height:calc(100vh - 300px);min-height:320px}}
.qcard{background:var(--surface);border:1px solid var(--line);padding:var(--sp-20) var(--sp-24) var(--sp-24)}
.qcard .qn{display:flex;justify-content:space-between;gap:var(--sp-12);font-size:.875rem;color:var(--text-2);margin-bottom:var(--sp-04)}
.qcard .ok{color:var(--success);display:none;align-items:center;gap:4px;font-weight:600}
.qcard.done .ok{display:inline-flex}
.qcard label.ql{display:block;font-size:1.125rem;line-height:1.5rem;font-weight:600;margin-bottom:var(--sp-12)}
.field{width:100%;background:var(--bg);border:0;border-bottom:1px solid var(--text);padding:var(--sp-12);min-height:96px;resize:vertical;font-size:1rem;line-height:1.5rem;border-radius:0}
.field:focus{outline:none;box-shadow:inset 0 0 0 1px var(--text);border-bottom-color:var(--text)}
.field::placeholder{color:var(--text-2)}

/* ===== Evaluación ===== */
.stepper{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 var(--sp-32);padding:0 0 var(--sp-24);border-bottom:1px solid var(--line)}
.step{position:relative}
.step + .step::before{content:"";position:absolute;top:17px;left:calc(-50% + 26px);right:calc(50% + 26px);height:2px;background:var(--n50)}
.step.after-success::before{background:var(--success)}
.step button{width:100%;background:none;border:0;padding:0 var(--sp-04);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:var(--sp-08);color:var(--text);text-align:center;border-radius:0}
.sym{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--n40);background:var(--surface);color:var(--text-2);font-weight:700;font-size:1rem}
.step button:hover .sym{border-color:var(--border)}
.step.active .sym{border-color:var(--border);color:var(--text)}
.step.success .sym{background:var(--success);border-color:var(--success);color:var(--surface)}
.step .sym .ms{font-size:22px;vertical-align:0}
.sl{font-weight:700;font-size:1rem;line-height:1.25rem}
.step.pending .sl{font-weight:400;color:var(--text-2)}
.ss{font-size:.8125rem;line-height:1.125rem;color:var(--text-2)}
@media (max-width:420px){.sl{font-size:.875rem}}
.team-head{margin-bottom:var(--sp-08)}
.team-head h1{display:flex;align-items:center;gap:var(--sp-12)}
.team-head h1 .ms{font-size:36px}
.team-head p{margin:0}
fieldset.crit{border:0;padding:0;margin:var(--sp-40) 0 0}
fieldset.crit legend{font-size:1.125rem;line-height:1.5rem;font-weight:600;display:flex;gap:var(--sp-12);align-items:flex-start;padding:0;margin-bottom:var(--sp-16)}
.cn{flex:0 0 auto;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--n50);font-size:.875rem;font-weight:700;background:var(--surface)}
fieldset.crit.done .cn{background:var(--text);border-color:var(--text);color:var(--bg)}
.opts{display:grid;gap:var(--sp-12);grid-template-columns:1fr}
@media (min-width:768px){.opts{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}}
.opt{position:relative;display:flex;flex-direction:column;gap:var(--sp-08);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--lv);padding:var(--sp-16);cursor:pointer;font-size:.9375rem;line-height:1.375rem}
.opt:hover{border-color:var(--border);border-top-color:var(--lv)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .pts{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:var(--sp-08)}
.opt .pts::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid var(--text);flex:0 0 auto}
.opt.sel{background:var(--sel-bg);outline:2px solid var(--border);outline-offset:-2px}
.opt.sel .pts::before{background:var(--text);box-shadow:inset 0 0 0 3px var(--sel-bg)}
.opt:focus-within{outline:2px solid var(--focus-ring);outline-offset:2px}
.lv-low{--lv:var(--success)} .lv-mid{--lv:var(--alert)} .lv-high{--lv:var(--error)} .lv-unk{--lv:var(--n50)}
.opt.unk{border-style:dashed;border-top-style:solid}
.qbox{margin-top:var(--sp-12);background:var(--surface);border:1px solid var(--line);padding:var(--sp-16)}
.qbox label{display:block;font-weight:600;margin-bottom:var(--sp-08)}
.totalbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--border);padding:var(--sp-12) 0 calc(var(--sp-12) + env(safe-area-inset-bottom,0px))}
.totalbar .wrap{display:flex;align-items:center;gap:var(--sp-16);flex-wrap:wrap;justify-content:space-between}
.tot{display:flex;align-items:baseline;gap:var(--sp-08)}
.tot b{font-family:var(--font-serif);font-size:2rem;line-height:2.25rem;font-weight:500;font-variant-numeric:tabular-nums}
.scale{display:flex;gap:var(--sp-08);flex-wrap:wrap}

/* ===== Decisión ===== */
.res-row{display:grid;grid-template-columns:1fr;gap:var(--sp-08);padding:var(--sp-16) 0;border-bottom:1px solid var(--line)}
.res-row:last-child{border-bottom:0;padding-bottom:0}
.res-row:first-child{padding-top:0}
@media (min-width:768px){.res-row{grid-template-columns:260px 1fr;align-items:center}}
.res-row .nm{font-weight:700;display:flex;gap:var(--sp-08);align-items:flex-start}
.res-row .nm small{display:block;font-weight:400;color:var(--text-2);font-size:.875rem}
.qlist{list-style:none;padding:0;margin:var(--sp-16) 0 0;display:flex;flex-direction:column;gap:var(--sp-12)}
.qlist li{background:var(--bg);border:1px solid var(--line);padding:var(--sp-16)}
.qlist .src{font-size:.875rem;color:var(--text-2);margin-bottom:var(--sp-08);display:flex;gap:6px;align-items:center}
.qlist .row{display:flex;justify-content:space-between;gap:var(--sp-12);align-items:center}
.qlist .field{background:var(--surface);min-height:72px}
.empty{color:var(--text-2)}
.picker{list-style:none;margin:var(--sp-16) 0 0;padding:0;border-top:1px solid var(--line)}
.picker li{display:flex;justify-content:space-between;gap:var(--sp-16);align-items:center;padding:var(--sp-12) 0;border-bottom:1px solid var(--line)}
.picker .st{display:block;font-size:.875rem;color:var(--text-2)}

/* ===== Presentación ===== */
.pres{background:var(--brand-black);color:var(--n20);padding:var(--sp-32) var(--sp-24)}
@media (min-width:768px){.pres{padding:var(--sp-64) var(--sp-48)}}
.pres:fullscreen{overflow:auto}
.pres-top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-24)}
.pres-top img{height:40px;width:auto}
.pres .eyebrow{color:#a4a4a4}
.pres h1{color:var(--n20);margin:0;max-width:20ch}
.psec{margin-top:var(--sp-48)}
.psec .divider{margin-bottom:var(--sp-16)}
.psec h2{color:var(--n20)}
.psec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-16);flex-wrap:wrap;margin-bottom:var(--sp-12)}
.psec-head h2{margin:0}
.btn.xs{min-height:32px;padding:0 var(--sp-12);font-size:.875rem;line-height:1rem;gap:6px;letter-spacing:.02em}
.btn.xs .ms{font-size:18px}
.btn.on-dark{color:var(--n20);border-color:var(--n70);background:transparent}
.field.on-dark{background:#2e2e2b;color:var(--n20);border-bottom-color:var(--n20);min-height:80px;margin-top:var(--sp-08)}
.field.on-dark::placeholder{color:#a4a4a4}
.field.on-dark:focus{box-shadow:inset 0 0 0 1px var(--n20)}
.btn.on-dark:hover{background:var(--yellow);border-color:var(--yellow);color:#1f1f1c}
.btn.on-dark:focus-visible{outline-color:var(--yellow)}
.pctx{font-family:var(--font-serif);font-size:1.25rem;line-height:1.75rem;max-width:72ch;margin:0;color:var(--n20)}
.pans{display:grid;grid-template-columns:1fr;gap:var(--sp-24) var(--sp-32);margin:0}
@media (min-width:768px){.pans{grid-template-columns:repeat(2,1fr)}}
.pans dt{font-weight:600;color:var(--n20)}
.pans dd{margin:var(--sp-04) 0 0;color:#d6d5d0}
.pans .none{color:#a4a4a4;font-style:italic}
.pcards{display:grid;grid-template-columns:1fr;gap:var(--sp-16)}
@media (min-width:768px){.pcards{grid-template-columns:repeat(3,1fr)}}
.pcard{border:1px solid var(--n80);padding:var(--sp-24)}
.pcard .lab{display:flex;align-items:flex-start;gap:var(--sp-08);color:#a4a4a4;line-height:1.5rem}
.pcard .lab .ms{margin-top:2px}
@media (min-width:768px){.pcard .lab{min-height:3rem}}
.pres.export .pcard .lab{min-height:3rem}
.pcard .lvl{font-family:var(--font-serif);font-size:2rem;line-height:2.5rem;font-weight:500;margin:var(--sp-12) 0 var(--sp-04);color:var(--n20)}
.pcard .pp{color:#a4a4a4;font-variant-numeric:tabular-nums;font-size:.875rem}
.pqs ol{margin:0;padding-left:1.4em;max-width:80ch}
.pqs li{margin-bottom:var(--sp-08);font-size:1.125rem;line-height:1.75rem}
.pres.export{width:1200px;padding:64px 56px}
.pres.export .pans,.pres.export .pcards{grid-template-columns:repeat(2,1fr)}
.pres.export .pcards{grid-template-columns:repeat(3,1fr)}
.pres.export h1{font-size:48px;line-height:56px}

/* ===== Facilitador ===== */
.tablewrap{overflow-x:auto;margin-top:var(--sp-24);border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:.9375rem}
th,td{text-align:left;padding:var(--sp-12) var(--sp-16);border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;background:var(--surface-2)}
.insight{margin-top:var(--sp-24);border-left:4px solid var(--yellow);background:var(--surface);padding:var(--sp-16) var(--sp-24)}

/* ===== Aviso y diálogo ===== */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand-black);color:var(--n20);padding:var(--sp-12) var(--sp-12) var(--sp-12) var(--sp-20);display:flex;gap:var(--sp-12);align-items:center;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast .btn{color:var(--n20);border-color:var(--n20);min-height:40px;font-size:1rem}
.toast .btn:hover{background:var(--yellow);border-color:var(--yellow);color:#1f1f1c}
.toast .x{background:none;border:0;color:var(--n20);cursor:pointer;display:grid;place-items:center;width:32px;height:32px}
.dlg-bg{position:fixed;inset:0;background:rgba(25,25,22,.6);display:grid;place-items:center;z-index:50;padding:var(--sp-16)}
.dlg{background:var(--surface);color:var(--text);padding:var(--sp-32);max-width:460px;width:100%;border-top:4px solid var(--yellow)}
.dlg p{margin:0 0 var(--sp-24);font-size:1.125rem;line-height:1.75rem}
.dlg .actions{margin-top:0;justify-content:flex-end}
@media print{.top,.totalbar,.toast,.no-print{display:none!important}main{padding:0}}
</style>
</head>

function scoreTeam(team){
  const crits = MATRIZ[team].crits; let pts = 0, done = 0, q = 0;
  crits.forEach((c,ci) => {
    const a = S.ans[team][ci];
    if(a === undefined || a === null) return;
    done++;
    if(a === "?"){ q++; pts += maxPts(c); } else pts += c.ops[a].p;
  });
  const idx = nivelIdx(team, pts);
  return { pts, done, total:crits.length, q, complete: done === crits.length, idx, nivel: MATRIZ[team].escala[idx].l };
}

  const out = [];

function bell(){
  try{
    const ctx = Music.ctx || new (window.AudioContext || window.webkitAudioContext)();
    Music.ctx = ctx; if(ctx.state === "suspended") ctx.resume();
    const out = ctx.createGain(); out.gain.value = .6; out.connect(ctx.destination);
    const partials = [[1,1],[2,.55],[2.76,.4],[5.4,.22],[8.93,.12]];
    [0, 1.4, 2.8].forEach(t0 => {
      const t = ctx.currentTime + t0;
      partials.forEach(([r,a]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = 660 * r;
        g.gain.setValueAtTime(.0001, t);
        g.gain.exponentialRampToValueAtTime(.35 * a, t + .01);
        g.gain.exponentialRampToValueAtTime(.0001, t + 2.6 / Math.sqrt(r));
        o.connect(g); g.connect(out); o.start(t); o.stop(t + 2.8);
      });
    });
  }catch(e){}
  if(navigator.vibrate) try{ navigator.vibrate([300,150,300,150,300]); }catch(e){}
}

/* =========================================================
   MÚSICA DE CONCENTRACIÓN (generada en el navegador, sin archivos)
   ========================================================= */
const Music = {
  ctx:null, out:null, voices:[], noise:null, loop:null, playing:false, step:0,
  CHORDS:[[220.00,261.63,329.63,392.00],[174.61,220.00,261.63,329.63],[130.81,196.00,261.63,329.63],[146.83,220.00,261.63,349.23]],
  start(){
    if(this.playing) return;
    try{
      if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = this.ctx; if(ctx.state === "suspended") ctx.resume();
      const out = ctx.createGain(); out.gain.value = .0001; out.connect(ctx.destination);
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900; lp.Q.value = .3; lp.connect(out);
      this.voices = this.CHORDS[0].map((f,i) => {
        const g = ctx.createGain(); g.gain.value = .06; g.connect(lp);
        const o1 = ctx.createOscillator(); o1.type = "sine"; o1.frequency.value = f; o1.connect(g);
        const o2 = ctx.createOscillator(); o2.type = "triangle"; o2.frequency.value = f; o2.detune.value = 7;
        const g2 = ctx.createGain(); g2.gain.value = .35; o2.connect(g2); g2.connect(g);
        const lfo = ctx.createOscillator(); lfo.frequency.value = .05 + i*.03;
        const lg = ctx.createGain(); lg.gain.value = .025; lfo.connect(lg); lg.connect(g.gain);
        [o1,o2,lfo].forEach(o => o.start());
        return {o1,o2,lfo};
      });
      const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      let last = 0; for(let i=0;i<len;i++){ const w = Math.random()*2 - 1; last = (last + .02*w)/1.02; d[i] = last*3.5; }
      const n = ctx.createBufferSource(); n.buffer = buf; n.loop = true;
      const ng = ctx.createGain(); ng.gain.value = .1; n.connect(ng); ng.connect(out); n.start();
      this.noise = n; this.out = out; this.step = 0;
      out.gain.exponentialRampToValueAtTime(.5, ctx.currentTime + 3);
      this.loop = setInterval(() => this.next(), 12000);
      this.playing = true;
    }catch(e){ this.playing = false; toast("No se pudo reproducir la música en este navegador."); }
    renderTimer();
  },
  next(){
    const ctx = this.ctx; this.step = (this.step + 1) % this.CHORDS.length; const ch = this.CHORDS[this.step];
    this.voices.forEach((v,i) => { v.o1.frequency.setTargetAtTime(ch[i], ctx.currentTime, 1.5); v.o2.frequency.setTargetAtTime(ch[i], ctx.currentTime, 1.5); });
  },
  stop(){
    if(!this.playing) return;
    const ctx = this.ctx, out = this.out, voices = this.voices, noise = this.noise;
    clearInterval(this.loop); this.playing = false;
    try{
      out.gain.cancelScheduledValues(ctx.currentTime);
      out.gain.setValueAtTime(Math.max(out.gain.value, .0001), ctx.currentTime);
      out.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + 1.2);
    }catch(e){}
    setTimeout(() => { try{ voices.forEach(v => { v.o1.stop(); v.o2.stop(); v.lfo.stop(); }); noise.stop(); out.disconnect(); }catch(e){} }, 1400);
    renderTimer();
  },
  toggle(){ this.playing ? this.stop() : this.start(); }
};

const timerStarted = () => { const T = S.timer; return T.running || T.done || T.remaining < TOTAL_SEC; };
function startTimer(){ const T = S.timer; if(!T.running && !T.done){ T.running = true; T.endAt = Date.now() + T.remaining*1000; Music.start(); } }
function timerTick(){
  const T = S.timer;
  if(T.running && T.endAt){
    T.remaining = Math.max(0, Math.ceil((T.endAt - Date.now())/1000));
    if(T.remaining === 0){
      T.running = false; T.endAt = null; T.done = true; save(); Music.stop(); bell();
      toast("Se acabaron los 20 minutos. Es momento de presentar.", "Ir a la presentación", "go:presentacion");
    }
  }
  renderTimer();
}
function timerToggle(){
  const T = S.timer;
  if(T.done) return;
  if(T.running){ T.remaining = Math.max(0, Math.ceil((T.endAt - Date.now())/1000)); T.running = false; T.endAt = null; Music.stop(); }
  else startTimer();
  save(); renderTimer();
}
function renderTimer(){
  const T = S.timer, el = document.getElementById("timer"), fill = document.getElementById("tbarFill");
  if(!S.mesa || S.screen === "facilitador"){ el.innerHTML = ""; fill.style.width = "0"; return; }
  el.innerHTML = `<div class="timer ${(!T.done && T.running && T.remaining <= 60) ? "warn" : ""}" role="timer" aria-label="Tiempo restante">
    <span class="t-lab">${T.done ? "Tiempo terminado" : "Tiempo"}</span>
    <span class="t-clock">${fmt(T.remaining)}</span>
    ${T.done ? "" : `<button class="nb-btn" data-act="timer-toggle" aria-label="${T.running ? "Pausar el tiempo" : "Iniciar el tiempo"}">${icon(T.running ? "pause" : "play_arrow")}</button>`}
    <button class="nb-btn" data-act="music" aria-pressed="${Music.playing}" aria-label="${Music.playing ? "Pausar la música de concentración" : "Reproducir música de concentración"}">${icon(Music.playing ? "music_note" : "music_off")}</button>
    <button class="nb-btn" data-act="timer-reset" aria-label="Reiniciar el tiempo">${icon("restart_alt")}</button>
  </div>`;
  fill.style.width = `${100 * (1 - T.remaining / TOTAL_SEC)}%`;
}

  nav.hidden = !show;
  if(!show) return;
  const cur = STEP_KEYS.indexOf(S.screen), max = Math.max(S.max || 0, cur);
  const stateOf = i => i === cur ? "active" : (!m && i > 0 ? "pending" : (i <= max ? "success" : "pending"));
  document.getElementById("gsList").innerHTML = STEP_KEYS.map((k,i) => {
    const st = stateOf(i), sc = SCREENS.find(x => x.k === k);
    const prev = i > 0 ? (stateOf(i-1) === "success" ? " after-success" : (stateOf(i-1) === "active" ? " after-active" : "")) : "";
    const srState = st === "success" ? "completado" : (st === "active" ? "paso actual" : "pendiente");
    return `<li class="gs-step ${st}${prev}"><button class="gs-btn" data-act="go:${k}" ${st === "active" ? 'aria-current="step"' : ""} ${!m && i > 0 ? "disabled" : ""} aria-label="Paso ${i+1}: ${esc(sc.label)}, ${srState}">
      <span class="gs-sym" aria-hidden="true">${st === "success" ? icon("check") : i + 1}</span><span class="gs-lab" aria-hidden="true">${esc(sc.label)}</span></button></li>`;
  }).join("");
  document.getElementById("gsCur").textContent = cur >= 0 ? `Paso ${cur+1} de ${STEP_KEYS.length} · ${SCREENS.find(x => x.k === S.screen).label}` : "Elijan un paso para continuar";
}

  const lines = Object.values(LIVE || {}).sort((a,b) => a.mesa-b.mesa).map(r => [r.mesa, r.titulo, r.etapa, r.equipos.exp.nivel, r.equipos.exp.pts, r.equipos.cam.nivel, r.equipos.cam.pts, r.equipos.com.nivel, r.equipos.com.pts, `${r.respondidas ?? 0}/7`, (r.preguntas||[]).join(" | ")].map(q).join(","));

/* =========================================================
   EXPORTAR PRESENTACIÓN A PNG
   ========================================================= */
function loadHtml2canvas(){
  if(window.html2canvas) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
async function exportPNG(){
  if(UI.editPres){ UI.editPres = false; render(); }
  const btn = document.getElementById("pngBtn"), m = mesa();
  if(btn){ btn.disabled = true; btn.innerHTML = `${icon("image")} Generando imagen…`; }
  try{
    await loadHtml2canvas();
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await window.html2canvas(document.getElementById("pres"), {
      scale:2, backgroundColor:"#191916", logging:false, windowWidth:1280,
      onclone: doc => { const el = doc.getElementById("pres"); if(el) el.classList.add("export"); }
    });
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    if(!blob) throw new Error("png");
    const ok = await saveFile(`caso-${m.id}-${slug(m.titulo)}.png`, blob, "image/png");
    if(ok) toast("Imagen exportada.");
  }catch(e){
    toast("No se pudo generar la imagen. Revisen la conexión e inténtenlo de nuevo.");
  }finally{
    const b = document.getElementById("pngBtn");
    if(b){ b.disabled = false; b.innerHTML = `${icon("image")} Exportar como PNG`; }
  }
}

/* =========================================================
   EVENTOS
   ========================================================= */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const [act, a1] = b.dataset.act.split(":");
  switch(act){
    case "go": go(a1); break;
    case "mesa":
      if(S.mesa === +a1){ go(S.screen === "inicio" ? "caso" : S.screen); break; }
      if(S.mesa && !(await ask("Cambiar de grupo borra lo que han avanzado en este dispositivo y reinicia el tiempo. ¿Quieren cambiar?", "Cambiar de grupo"))) break;
      S = blank(); S.mesa = +a1; UI.adding = false; go("caso"); break;
    case "caso-next": startTimer(); go("notas"); break;
    case "team": S.team = a1; save(); render(); document.getElementById("tab-"+a1)?.focus({preventScroll:true}); try{ window.scrollTo({top:0}); }catch(err){} break;
    case "timer-toggle": timerToggle(); break;
    case "music": Music.toggle(); break;
    case "timer-reset":
      if(await ask("¿Reiniciar el tiempo? Vuelve a 20 minutos y queda en pausa.", "Reiniciar el tiempo")){ S.timer = newTimer(); Music.stop(); save(); render(); }
      break;
    case "pres-edit":
      UI.editPres = !UI.editPres; render();
      (UI.editPres ? document.getElementById("pres-resp-0") : document.getElementById("presEdit"))?.focus({preventScroll:true});
      break;
    case "acc": UI.acc = !UI.acc; render(); document.getElementById("accBtn")?.focus({preventScroll:true}); break;
    case "q-open": UI.adding = true; UI.draft = ""; render(); document.getElementById("newq")?.focus(); break;
    case "q-cancel": UI.adding = false; UI.draft = ""; render(); document.getElementById("addBtn")?.focus({preventScroll:true}); break;
    case "q-add": addClave(); break;
    case "q-del": { const list = claves(); list.splice(+a1, 1); S.claves = list; save(); render(); document.getElementById("addBtn")?.focus({preventScroll:true}); break; }
    case "export-png": exportPNG(); break;
    case "fac-remove":
      if(DB && await ask(`¿Quitar la mesa ${a1} de la comparación? Si la mesa sigue trabajando, volverá a aparecer.`, "Quitar"))
        DB.doc("resultados/mesa-" + a1).delete().catch(() => toast("No tienes permiso para quitar resultados."));
      break;
    case "fac-clear":
      if(DB && LIVE && await ask("¿Vaciar la comparación? Úsalo para empezar una sesión nueva.", "Vaciar"))
        Promise.all(Object.keys(LIVE).map(k => DB.doc("resultados/mesa-" + k).delete())).catch(() => toast("No tienes permiso para borrar resultados."));
      break;
    case "fac-csv": saveFile("dsit-comparacion-mesas.csv", facCsv(), "text/csv;charset=utf-8"); break;
    case "toast-close": document.getElementById("toastHost").innerHTML = ""; break;
  }
});
document.addEventListener("keydown", e => {
  if(e.target.dataset && e.target.dataset.newq !== undefined){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); addClave(); return; }
    if(e.key === "Escape"){ UI.adding = false; UI.draft = ""; render(); document.getElementById("addBtn")?.focus(); return; }
  }
  const tab = e.target.closest && e.target.closest(".ttab");
  if(tab && (e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "Home" || e.key === "End")){
    e.preventDefault();
    const i = TEAMS.indexOf(S.team);
    const n = e.key === "Home" ? 0 : e.key === "End" ? TEAMS.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + TEAMS.length) % TEAMS.length;
    S.team = TEAMS[n]; save(); render(); document.getElementById("tab-" + S.team)?.focus();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.type === "radio" && t.name.startsWith("ans-")){
    const [, team, ci] = t.name.split("-");
    S.ans[team][+ci] = t.value === "?" ? "?" : +t.value;
    save(); render();
    if(t.value === "?") document.getElementById(`q-${team}-${ci}`)?.focus({preventScroll:true});
  }
});
function addClave(){
  const v = (UI.draft || "").trim();
  if(!v){ document.getElementById("newq")?.focus(); toast("Escriban la pregunta antes de agregarla."); return; }
  S.claves = [...claves(), v]; UI.adding = false; UI.draft = ""; save(); render();
  document.getElementById("addBtn")?.focus({preventScroll:true});
}
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.newq !== undefined){ UI.draft = t.value; return; }
  if(!t.dataset.bind) return;
  setPath(S, t.dataset.bind, t.value); save();
  if(t.dataset.resp !== undefined){
    document.getElementById("qc-" + t.dataset.resp)?.classList.toggle("done", t.value.trim() !== "");
    const n = answered();
    const rc = document.getElementById("respCount"); if(rc) rc.textContent = `${n} de ${GUIA.length} respondidas`;
    const rb = document.getElementById("respBar"); if(rb) rb.style.width = `${100*n/GUIA.length}%`;
  }
  renderNav();
});

render();
setInterval(timerTick, 1000);
</script>
</body>
